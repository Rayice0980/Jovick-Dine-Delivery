<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sign in to your Jovick Dine Delivery account."
    />
    <title>Sign In | Jovick Dine Delivery</title>
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body data-page="login">
    <div id="siteHeader"></div>
    <main class="page-content">
      <div class="container">
        <div class="auth-wrap">
          <a class="brand" href="index.html">
            <span class="brand-mark">J</span>
            <span>jovick dine<small>GOOD FOOD. GOOD MOOD.</small> </span>
          </a>
          <div class="form-card">
            <h2>Welcome back.</h2>
            <p>Your next favourite meal is waiting.</p>
            <form
              data-demo-form
              data-success="Demo only: account authentication is not connected yet."
            >
              <div class="field">
                <label for="email">Email address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                  placeholder="you@example.com"
                />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <div class="password-row">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="Enter your password"
                  />
                  <button
                    class="password-toggle"
                    id="togglePassword"
                    type="button"
                    aria-pressed="false"
                  >
                    Show
                  </button>
                </div>
              </div>
              <button class="btn" style="width: 100%" type="submit">
                Sign in ↗
              </button>
              <p class="form-note" data-form-note aria-live="polite">
                This is a UI demo; no account is created or authenticated.
              </p>
            </form>
          </div>
          <p style="margin-top: 20px">
            New to Jovick?
            <a class="text-link" href="signup.html">Create an account</a>
          </p>
        </div>
      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="scripts/app.js" defer></script>
    <script src="scripts/login.js" defer></script>
  </body>
</html>
