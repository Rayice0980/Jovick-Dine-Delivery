<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create a Jovick Dine Delivery account."><title>Create Account | Jovick Dine Delivery</title><link rel="stylesheet" href="styles/signup.css"></head><body data-page="signup"><div id="siteHeader"></div><main class="page-content"><div class="container"><div class="auth-wrap"><a class="brand" href="index.html"><span class="brand-mark">J</span><span>jovick dine<small>GOOD FOOD. GOOD MOOD.</small></span></a><div class="form-card"><h2>Join us at the table.</h2><p>Create your account to make ordering easier.</p><form data-demo-form data-success="Demo only: your account details were not saved to a server."><div class="field"><label for="fullName">Full name</label><input id="fullName" name="name" autocomplete="name" required placeholder="Your full name"></div><div class="field"><label for="signupEmail">Email address</label><input id="signupEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="signupPassword">Create password</label><div class="password-row"><input id="signupPassword" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"><button class="password-toggle" id="toggleSignupPassword" type="button">Show</button></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Type your password again"><p class="field-error" id="passwordMatchError" aria-live="polite"></p></div></div><button class="btn" style="width:100%" type="submit">Create account ↗</button><p class="form-note" data-form-note aria-live="polite">This demo does not store passwords or create live accounts.</p></form></div><p style="margin-top:20px">Already have an account? <a class="text-link" href="login.html">Sign in</a></p></div></div></main><div id="siteFooter"></div><script src="scripts/app.js" defer></script><script src="scripts/signup.js" defer></script></body></html>
